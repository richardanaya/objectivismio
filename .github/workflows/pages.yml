name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/css _site/articles _site/assets
          cp index.html .nojekyll _site/
          cp css/base.css css/home.css css/article.css _site/css/
          cp articles/inductica-objectivist-ai.html _site/articles/
          cp assets/objectivism-hero.png assets/immortal-robot-dither.png assets/inter-latin.woff2 assets/geist-serif-regular.woff2 assets/favicon.svg assets/typeset.js _site/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
